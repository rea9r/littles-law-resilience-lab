<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>order-api resources (slide style)</title>
<link rel="stylesheet" href="slide.css">
</head>
<body>
<!-- 升目：大きい箱 150×56（共有する資源）、小さい箱 120×40（エンドポイントと外の部品）。紫は共有する資源の 2 つだけ -->
<svg class="fig" width="800" height="324" viewBox="0 0 800 324" xmlns="http://www.w3.org/2000/svg" data-themes="dark light">
  <defs>
    <marker id="fig-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker>
    <marker id="fig-arrow-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <rect class="bg" width="800" height="324"/>
  <g transform="translate(-4 12)">

  <rect class="frame" x="64" y="0" width="582" height="288"/>
  <text class="n" x="80" y="26">order-api</text>

  <!-- 共有する資源 -->
  <rect class="box key" x="80" y="120" width="150" height="56"/>
  <text class="on mid" x="155" y="148" data-en="Thread pool">スレッドプール</text>
  <text class="n mid" x="155" y="198" data-en="40, shared by every API">40 本・全 API で共有</text>

  <rect class="box key" x="480" y="120" width="150" height="56"/>
  <text class="on mid" x="555" y="148">HikariCP</text>
  <text class="n mid" x="555" y="198" data-en="10, shared by every API">10 本・全 API で共有</text>

  <!-- エンドポイント -->
  <rect class="box" x="290" y="44" width="120" height="40"/>
  <rect class="box" x="290" y="128" width="120" height="40"/>
  <rect class="box" x="290" y="212" width="120" height="40"/>
  <text class="t m mid" x="350" y="64">/orders</text>
  <text class="t m mid" x="350" y="148">/products</text>
  <text class="t m mid" x="350" y="232">/livez</text>
  <text class="n sm mid" x="350" y="104" data-en="calls payment">決済 API を呼ぶ</text>
  <text class="n sm mid" x="350" y="188" data-en="reads the DB">DB を読むだけ</text>
  <text class="n sm mid" x="350" y="272">liveness probe</text>

  <!-- 外の部品 -->
  <rect class="box" x="676" y="38" width="120" height="40"/>
  <rect class="box" x="676" y="128" width="120" height="40"/>
  <text class="t mid" x="736" y="58">payment-api</text>
  <text class="t mid" x="736" y="148">PostgreSQL</text>

  <!-- 線：入口 → スレッド → 各エンドポイント（括弧で分岐） -->
  <line class="ln to" x1="12" y1="148" x2="78" y2="148"/>
  <text class="n mid" x="40" y="134">70 rps</text>
  <path class="ln" d="M230 148 H260 M260 64 V232"/>
  <line class="ln to" x1="260" y1="64" x2="288" y2="64"/>
  <line class="ln to" x1="260" y1="148" x2="288" y2="148"/>
  <line class="ln to" x1="260" y1="232" x2="288" y2="232"/>

  <!-- /orders → 決済 API、/orders と /products → HikariCP（括弧で合流） -->
  <line class="ln to" x1="410" y1="58" x2="674" y2="58"/>
  <path class="ln" d="M410 74 H450 V148"/>
  <line class="ln to" x1="410" y1="148" x2="478" y2="148"/>
  <line class="ln to" x1="630" y1="148" x2="674" y2="148"/>
  </g>
</svg>
<script src="diagram.js"></script>
</body>
</html>
