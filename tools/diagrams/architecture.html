<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Architecture</title>
<link rel="stylesheet" href="explainer.css">
</head>
<body>
<!-- kind クラスタを薄い灰の面に、部品を同じ高さの白いカードで描く（ほかの図と同じく、線ではなく面で区切る）。4 列の格子：幅 160 を 4 列、面の縁から 25px 内側。上段は要求の経路、その下に DB、一番下の帯が観測。線は 3 種類：要求（色つきの太線。主役）、操作（薄い灰の細線）、メトリクス（点線）。k6 の色つきの行から同じ色の線を出し、紫（/orders）だけが決済 API まで続く -->
<svg id="fig" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="explainer.js"></script>
<script>
  const svg = document.getElementById('fig');
  // 矢じりは線の太さによらず同じ大きさにする
  const d = el(svg, 'defs');
  for (const [id, c, size] of [['h-ctl', '#9a9aa2', 10], ['h-ord', '#5342a2', 12], ['h-prd', '#00697c', 12], ['h-met', '#7a7a82', 9]]) {
    const m = el(d, 'marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: size, markerHeight: size, markerUnits: 'userSpaceOnUse', orient: 'auto' });
    el(m, 'path', { d: 'M0 1L10 5L0 9z', fill: c });
  }

  /** カード：行を上ぞろえで書く（名前の行が、段をまたいで 1 本の線にそろう） */
  function card(x, y, w, h, lines, { stroke = '#d9d9df', width = 1, fill = '#ffffff' } = {}) {
    el(svg, 'rect', { x, y, width: w, height: h, rx: 6, fill, stroke, 'stroke-width': width });
    lines.forEach(([cls, s], i) => text(svg, x + w / 2, y + 27 + i * 20, `${cls} mid`, s));
    return { x, y, w, h, cx: x + w / 2, cy: y + h / 2, r: x + w, b: y + h };
  }

  // 上段のカードは 3 行で高さをそろえる
  // 格子は面の縁から 25px 内側。入れ子の帯（面の縁から 8px）の中でも、カードの周りに 17px 前後の余白が残る
  const X0 = 37, W = [160, 160, 160, 160], G = (726 - 640) / 3;
  const cx = [X0];
  for (let i = 1; i < 4; i++) cx.push(cx[i - 1] + W[i - 1] + G);
  const PX = 12, PY = 100, PW = 776;

  const Y1 = PY + 44, H1 = 86, CH = Y1 + H1 + 26, DBY = CH + 24, BY = DBY + 44 + 28, Y3 = BY + 18, H3 = 62, PH = Y3 + H3 + 26 - PY;
  // クラスタ（面）。カードより先に描く
  el(svg, 'rect', { class: 'pool', x: PX, y: PY, width: PW, height: PH, rx: 10 });
  // 見出しは 2 つとも左上。run.sh からの矢印は k6 の右寄り（kx）に入れて、見出しと交わらないようにする
  text(svg, X0, PY + 24, 'small b', tr('kind クラスタ', 'kind cluster'));

  // 観測の帯：クラスタの面の内側に入れ子にして、同じクラスタの中にあることを形で見せる
  el(svg, 'rect', { x: PX + 8, y: BY, width: PW - 16, height: PY + PH - BY - 8, rx: 4, fill: '#e3e3ea' });
  text(svg, X0, BY + 24, 'small b', tr('メトリクス', 'Metrics'));

  // クラスタの外：run.sh（k6 の真上）
  const host = { x: X0, y: 12, w: W[0], h: 44 };
  host.r = host.x + host.w; host.b = host.y + host.h; host.cy = host.y + host.h / 2;
  el(svg, 'rect', { x: host.x, y: host.y, width: host.w, height: host.h, rx: 6, fill: '#ffffff', stroke: '#b4b4bc', 'stroke-width': 1.2 });
  text(svg, host.x + host.w / 2, host.y + 27, 'name mid', 'scenarios/run.sh');

  // 上段：要求の経路
  const k6 = card(cx[0], Y1, W[0], H1, [['name', 'k6'], ['small ord b', tr('/orders 60 件/秒', '/orders 60 req/s')], ['small prd b', tr('/products 10 件/秒', '/products 10 req/s')]]);
  const order = card(cx[1], Y1, W[1], H1, [['name', 'order-api'], ['small', tr('スレッド 40 本', '40 threads')], ['small', tr('コネクション 10 本', '10 DB connections')]]);
  const toxi = card(cx[2], Y1, W[2], H1, [['name', 'Toxiproxy'], ['small bad', tr('障害中は', 'during the fault,')], ['small bad', tr('応答を 5 秒遅らせる', 'adds 5 s to replies')]], { stroke: '#c03a33', width: 1.2, fill: '#fbe3e1' });
  const pay = card(cx[3], Y1, W[3], H1, [['name', 'payment-api'], ['small', tr('決済 API のモック', 'payment API mock')], ['small', tr('スレッド 6 本', '6 threads')]]);

  // 要求：k6 の色つきの行から、その色の線を出す。紫（/orders）だけが決済 API まで続く
  const yo = Y1 + 27 + 20 - 5, yp = yo + 20;
  el(svg, 'line', { class: 'ln ord req main', x1: k6.r, y1: yo, x2: order.x - 1, y2: yo, 'marker-end': 'url(#h-ord)' });
  el(svg, 'line', { class: 'ln prd req main', x1: k6.r, y1: yp, x2: order.x - 1, y2: yp, 'marker-end': 'url(#h-prd)' });
  el(svg, 'line', { class: 'ln ord req main', x1: order.r, y1: yo, x2: toxi.x - 1, y2: yo, 'marker-end': 'url(#h-ord)' });
  el(svg, 'line', { class: 'ln ord req main', x1: toxi.r, y1: yo, x2: pay.x - 1, y2: yo, 'marker-end': 'url(#h-ord)' });

  // DB（order-api の真下）
  // /orders も /products も DB を使うので、k6 からの線と同じ色の 2 本で引く
  const db = card(order.cx - 55, DBY, 110, 44, [['name', 'PostgreSQL']]);
  el(svg, 'line', { class: 'ln ord req main', x1: order.cx - 12, y1: order.b, x2: order.cx - 12, y2: db.y - 1, 'marker-end': 'url(#h-ord)' });
  el(svg, 'line', { class: 'ln prd req main', x1: order.cx + 12, y1: order.b, x2: order.cx + 12, y2: db.y - 1, 'marker-end': 'url(#h-prd)' });

  // 観測：Prometheus と Grafana（Grafana が Prometheus に問い合わせる）
  const prom = card(cx[2], Y3, W[2], H3, [['name', 'Prometheus'], ['small', tr('localhost:9090 で開く', 'open localhost:9090')]]);
  const graf = card(cx[3], Y3, W[3], H3, [['name', 'Grafana'], ['small', tr('localhost:3000 で開く', 'open localhost:3000')]]);
  // Grafana が Prometheus に問い合わせる（観測系なので点線）
  el(svg, 'line', { class: 'ln met', x1: graf.x, y1: prom.cy, x2: prom.r + 1, y2: prom.cy, 'marker-end': 'url(#h-met)' });

  // メトリクス：Prometheus から 1 本出て T 字に分かれ、order-api と payment-api の 8081 番を取りに行く。k6 は自分から送る
  // T 字の分かれ目は帯のすぐ上まで下げ、幹を短くする（Toxiproxy から離して、Toxiproxy を監視しているように読ませない）。左右は対称
  const TY = BY - 16, dl = order.r - 10, dr = pay.x + 10;
  el(svg, 'path', { class: 'ln met', d: `M${prom.cx} ${prom.y} V${TY} H${dl} V${order.b + 1}`, 'marker-end': 'url(#h-met)' });
  el(svg, 'path', { class: 'ln met', d: `M${prom.cx} ${TY} H${dr} V${pay.b + 1}`, 'marker-end': 'url(#h-met)' });
  text(svg, prom.cx, TY - 8, 'note mid', tr('1 秒ごとに :8081 を取りに行く', 'scrapes :8081 every second'));
  const kx = k6.r - 36;
  el(svg, 'path', { class: 'ln met', d: `M${kx} ${k6.b} V${prom.cy} H${prom.x - 1}`, 'marker-end': 'url(#h-met)' });
  text(svg, (kx + prom.x) / 2, prom.cy - 8, 'note mid', tr('結果を 2 秒ごとに送る', 'pushes results every 2 s'));

  // run.sh からの操作
  el(svg, 'line', { class: 'ln thin ctl', x1: kx, y1: host.b, x2: kx, y2: k6.y - 1, 'marker-end': 'url(#h-ctl)' });
  text(svg, kx + 8, (host.b + PY) / 2 + 5, 'note', tr('負荷を開始', 'starts the load'));
  // Toxiproxy には中心から外して入れる（Prometheus からの点線と同じ縦の軸に乗せない）
  const ex = toxi.x + 36;
  el(svg, 'path', { class: 'ln thin ctl', d: `M${host.r} ${host.cy} H${ex} V${toxi.y - 1}`, 'marker-end': 'url(#h-ctl)' });
  text(svg, (host.r + ex) / 2, host.cy - 8, 'note mid', tr(':8474 で遅延を入れる・外す', 'adds / removes the delay via :8474'));

  canvas(svg, 800, PY + PH + 12);
</script>
</body>
</html>
