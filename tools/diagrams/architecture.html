<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Architecture</title>
<link rel="stylesheet" href="explainer.css">
</head>
<body>
<!-- 上段：要求の経路（k6 → order-api → Toxiproxy → payment-api）。下段：DB と観測。クラスタの外の run.sh が負荷・設定・遅延を操作する。紫は /orders だけが通る線、赤は障害を入れるところ -->
<svg id="fig" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="explainer.js"></script>
<script>
  const svg = document.getElementById('fig');
  defs(svg);
  const COL = { k6: [26, 144], order: [204, 150], toxi: [414, 140], pay: [592, 182] };
  const Y1 = 150, Y2 = 330;

  // クラスタの外：run.sh
  const host = box(svg, 20, 12, 760, [['body', tr('scenarios/run.sh（make scenario-…）', 'scenarios/run.sh (make scenario-…)')]], { fill: '#f4f4f7', pad: 12 });
  el(svg, 'rect', { class: 'scope', x: 12, y: 96, width: 776, height: 368, rx: 10 });
  // run.sh からの矢印と交わらないよう、右上に置く
  text(svg, 772, 122, 'small b end', tr('kind クラスタ', 'kind cluster'));

  // 上段
  const k6 = box(svg, COL.k6[0], Y1, COL.k6[1], [['name', 'k6'], ['small ord b', tr('/orders 60 件/秒', '/orders 60 req/s')], ['small prd b', tr('/products 10 件/秒', '/products 10 req/s')]]);
  const order = box(svg, COL.order[0], Y1, COL.order[1], [['name', 'order-api'], ['small', tr('スレッド 40 本', '40 threads')], ['small', tr('コネクション 10 本', '10 DB connections')]], { stroke: '#19191c', width: 2 });
  const toxi = box(svg, COL.toxi[0], Y1, COL.toxi[1], [['name', 'Toxiproxy'], ['small bad', tr('障害中は応答を', 'delays responses')], ['small bad', tr('5 秒遅らせる', 'by 5 s (fault)')]], { stroke: '#c03a33', width: 2 });
  const pay = box(svg, COL.pay[0], Y1, COL.pay[1], [['name', 'payment-api'], ['small', tr('決済 API のモック', 'payment API mock')], ['small', tr('平均 0.05 秒・p99 0.12 秒', 'mean 0.05 s · p99 0.12 s')], ['small', tr('スレッド 6 本', '6 threads')]]);

  // 下段
  const db = box(svg, COL.order[0], Y2, COL.order[1], [['name', 'PostgreSQL']]);
  const prom = box(svg, COL.toxi[0] - 12, Y2, COL.toxi[1] + 24, [['name', 'Prometheus'], ['small', tr('localhost:9090 で開ける', 'open at localhost:9090')]]);
  const graf = box(svg, COL.pay[0], Y2, COL.pay[1], [['name', 'Grafana'], ['small', tr('localhost:3000 で開ける', 'open at localhost:3000')]]);

  // 要求の経路
  const ky = Y1 + 34;
  el(svg, 'line', { class: 'ln', x1: k6.r, y1: ky, x2: order.x - 3, y2: ky, 'marker-end': 'url(#arrow)' });
  el(svg, 'line', { class: 'ln ord', x1: order.r, y1: ky, x2: toxi.x - 3, y2: ky, 'marker-end': 'url(#arrow-ord)' });
  el(svg, 'line', { class: 'ln ord', x1: toxi.r, y1: ky, x2: pay.x - 3, y2: ky, 'marker-end': 'url(#arrow-ord)' });
  el(svg, 'line', { class: 'ln', x1: order.cx - 30, y1: order.b, x2: order.cx - 30, y2: db.y - 3, 'marker-end': 'url(#arrow)' });
  // Grafana が Prometheus に問い合わせる（矢印は始める側から）
  el(svg, 'line', { class: 'ln', x1: graf.x, y1: prom.y + 30, x2: prom.r + 3, y2: prom.y + 30, 'marker-end': 'url(#arrow)' });

  // run.sh からの操作
  // 設定はクラスタ全体（order-api と payment-api）に当てるので、矢印はクラスタの枠で止める
  const ops = [[k6.cx, k6.y, tr('負荷を開始', 'starts the load')], [order.cx, 96 + 3, tr('設定を適用', 'applies the scenario')], [toxi.cx, toxi.y, tr(':8474 遅延を入れる・外す', ':8474 adds / removes the delay')]];
  for (const [x, y, s] of ops) {
    el(svg, 'line', { class: 'ln thin', x1: x, y1: host.b, x2: x, y2: y - 3, 'marker-end': 'url(#arrow)' });
    text(svg, x + 6, host.b + 26, 'small', s);
  }

  // メトリクス（灰の点線）。矢印は始める側から向ける：order-api と payment-api の 8081 番は Prometheus が取りに行き、k6 は自分から送る
  const MY = 290;
  el(svg, 'path', { class: 'ln thin dot', d: `M${prom.cx - 20} ${prom.y} V${MY} H${order.r - 24} V${order.b + 3}`, 'marker-end': 'url(#arrow-light)' });
  text(svg, order.r - 18, order.b + 20, 'small', tr(':8081（別のスレッド）', ':8081 (separate threads)'));
  el(svg, 'path', { class: 'ln thin dot', d: `M${prom.cx + 20} ${prom.y} V${MY} H${pay.cx} V${pay.b + 3}`, 'marker-end': 'url(#arrow-light)' });
  text(svg, pay.cx + 6, pay.b + 20, 'small', ':8081');
  text(svg, prom.cx, MY - 8, 'small mid', tr('1 秒ごとに取りに行く', 'scraped every second'));
  const KY = 442;
  el(svg, 'path', { class: 'ln thin dot', d: `M${k6.cx} ${k6.b} V${KY} H${prom.cx} V${prom.b + 3}`, 'marker-end': 'url(#arrow-light)' });
  text(svg, k6.cx + 8, KY - 8, 'small', tr('結果を 2 秒ごとに送る', 'pushes results every 2 s'));
  // 凡例：紫の線は /orders の決済 API の呼び出しだけが通る
  el(svg, 'line', { class: 'ln ord', x1: 540, y1: 448, x2: 572, y2: 448 });
  text(svg, 580, 453, 'small', tr('/orders の決済 API の呼び出し', 'payment calls from /orders'));
  canvas(svg, 800, 476);
</script>
</body>
</html>
