<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Timeout boundary</title>
<link rel="stylesheet" href="explainer.css">
<style>
  /* この図だけは暗い背景（記事の Grafana のグラフにそろえる） */
  #fig .small, #fig .body { fill: #c7c7cf; }
  #fig .row-grid { stroke: #34383e; }
</style>
</head>
<body>
<!-- タイムアウトで足りるかの境目（暗い背景）。タイムアウトは下流の平常時の p99.9 より短くできないので、障害時の λW は少なくとも「到着率 × p99.9」になる。これがプールの大きさ × 0.7 を超える範囲（線より上）では、どのタイムアウトでもそのプールが尽きる。両軸とも対数 -->
<svg id="fig" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="explainer.js"></script>
<script>
  const svg = document.getElementById('fig');
  defs(svg);
  const PX0 = 110, PX1 = 770, PY0 = 24, PY1 = 384;
  const RMIN = 10, RMAX = 1000, PMIN = 0.01, PMAX = 10;
  const lg = Math.log10;
  const X = (rate) => PX0 + (PX1 - PX0) * (lg(rate) - lg(RMIN)) / (lg(RMAX) - lg(RMIN));
  const Y = (p) => PY0 + (PY1 - PY0) * (lg(PMAX) - lg(p)) / (lg(PMAX) - lg(PMIN));
  const clampP = (p) => Math.min(PMAX, Math.max(PMIN, p));

  // 領域の色：緑＝タイムアウトで足りる、赤系＝バルクヘッドなどが要る。点の色：青＝決済 API、赤茶＝遅い決済 API
  const BG = '#181b1f', OK = '#1D9E75', OK_TEXT = '#5DCAA5', NG = '#D85A30', NG_TEXT = '#F0997B';
  const LINE = '#c3c2b7', DASH = '#8f8e87', NORMAL = '#185FA5', SLOW = '#993C1D', POINT_TEXT = '#ececf1';
  const THREADS = 40 * 0.7, CONNS = 10 * 0.7;
  const NORMAL_P = 0.165, SLOW_P = 1.263, RATE = 60;

  /** 境目の線より下（below）か上の範囲を、多角形の点の並びで返す */
  function region(cap, below) {
    const pts = [];
    for (let i = 0; i <= 120; i++) {
      const r = RMIN * (RMAX / RMIN) ** (i / 120);
      pts.push(`${X(r)},${Y(clampP(cap / r))}`);
    }
    const edge = below ? PMIN : PMAX;
    pts.push(`${X(RMAX)},${Y(edge)}`, `${X(RMIN)},${Y(edge)}`);
    return pts.join(' ');
  }
  el(svg, 'polygon', { points: region(THREADS, true), fill: OK, 'fill-opacity': 0.16 });
  el(svg, 'polygon', { points: region(THREADS, false), fill: NG, 'fill-opacity': 0.18 });

  // 目盛り
  for (const r of [10, 20, 50, 100, 200, 500, 1000]) {
    el(svg, 'line', { class: 'row-grid', x1: X(r), y1: PY0, x2: X(r), y2: PY1 });
    text(svg, X(r), PY1 + 24, 'small mid', r.toLocaleString('en-US'));
  }
  for (const [p, s] of [[10, tr('10 秒', '10 s')], [1, tr('1 秒', '1 s')], [0.1, tr('100ms', '100 ms')], [0.01, tr('10ms', '10 ms')]]) {
    el(svg, 'line', { class: 'row-grid', x1: PX0, y1: Y(p), x2: PX1, y2: Y(p) });
    text(svg, PX0 - 10, Y(p) + 5, 'small end', s);
  }
  el(svg, 'rect', { x: PX0, y: PY0, width: PX1 - PX0, height: PY1 - PY0, fill: 'none', stroke: '#4a4f56', 'stroke-width': 1 });
  text(svg, (PX0 + PX1) / 2, PY1 + 54, 'small mid', tr('1 台あたりの到着率（件/秒）', 'arrival rate per instance (req/s)'));
  el(svg, 'text', { x: 0, y: 0, class: 'small mid', transform: `translate(34 ${(PY0 + PY1) / 2}) rotate(-90)` }, tr('下流の平常時の p99.9', "downstream's normal p99.9"));

  // 境目の線。到着率 × p99.9 ＝ プールの大きさ × 使ってよい割合 0.7
  for (const [cap, dash] of [[THREADS, null], [CONNS, '7 5']]) {
    const ra = Math.max(RMIN, cap / PMAX), rb = Math.min(RMAX, cap / PMIN);
    el(svg, 'line', { x1: X(ra), y1: Y(cap / ra), x2: X(rb), y2: Y(cap / rb), stroke: dash ? DASH : LINE, 'stroke-width': dash ? 2 : 2.6, ...(dash && { 'stroke-dasharray': dash }) });
  }
  text(svg, X(RMAX) - 20, Y(0.45), 'body end', tr('スレッド 40 本の線（28 本）', '40-thread line (28)'));
  text(svg, X(60), Y(0.017), 'body', tr('コネクション 10 本の線（7 本）', '10-connection line (7)'));

  // 領域の名前
  text(svg, X(12), Y(0.03), 'hl', tr('タイムアウトで足りる', 'a timeout is enough'));
  svg.lastChild.style.fill = OK_TEXT;
  text(svg, X(RMAX) - 20, Y(6), 'hl end', tr('バルクヘッドなどが要る', 'needs a bulkhead or more'));
  svg.lastChild.style.fill = NG_TEXT;

  // 決済 API が、同じ p99.9 のままタイムアウトで足りなくなる到着率
  const rConn = CONNS / NORMAL_P, rThr = THREADS / NORMAL_P;
  el(svg, 'line', { x1: X(RATE), y1: Y(NORMAL_P), x2: X(rThr), y2: Y(NORMAL_P), stroke: '#378ADD', 'stroke-width': 1.6, 'stroke-dasharray': '2 3' });
  for (const r of [rConn, rThr]) el(svg, 'circle', { cx: X(r), cy: Y(NORMAL_P), r: 3.5, fill: LINE });
  text(svg, X(rConn) - 4, Y(NORMAL_P) + 26, 'small end', tr('約 42 件/秒', '~42 req/s'));
  text(svg, X(rThr) + 8, Y(NORMAL_P) - 10, 'small', tr('約 170 件/秒', '~170 req/s'));

  // この実験の 2 つの下流（到着率は 60 件/秒）
  el(svg, 'circle', { cx: X(RATE), cy: Y(NORMAL_P), r: 8, fill: NORMAL, stroke: '#ffffff', 'stroke-width': 2.5 });
  el(svg, 'circle', { cx: X(RATE), cy: Y(SLOW_P), r: 8, fill: SLOW, stroke: '#ffffff', 'stroke-width': 2.5 });
  text(svg, X(RATE), Y(NORMAL_P) - 16, 'lbl mid', tr('決済 API（165ms）', 'payment API (165 ms)'));
  svg.lastChild.style.fill = POINT_TEXT;
  text(svg, X(RATE) + 16, Y(SLOW_P) - 10, 'lbl', tr('遅い決済 API（約 1.3 秒）', 'slow payment API (~1.3 s)'));
  svg.lastChild.style.fill = POINT_TEXT;

  canvas(svg, 800, PY1 + 70);
  svg.firstChild.setAttribute('fill', BG);
</script>
</body>
</html>
