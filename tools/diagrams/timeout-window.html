<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Timeout window</title>
<link rel="stylesheet" href="explainer.css">
<style>
  .z-short { fill: #e2e2e8; }
  .z-long { fill: #f6d3cf; }
  .t-short { font-size: 14px; fill: #3c3c44; }
  .t-long { font-size: 14px; fill: #8f2a24; }
</style>
</head>
<body>
<!-- 決済 API のタイムアウトの下限と上限。段ごとに帯を 2 本引く。上の帯は、短すぎて平常時にもタイムアウトする長さ（0〜下限）。下の帯は、長すぎて障害時にプールが尽きる長さ（上限〜）。帯のあいだに隙間があれば、そこから選べる。帯が重なれば、どの値でもどちらかが起きる -->
<svg id="fig" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="explainer.js"></script>
<script>
  const svg = document.getElementById('fig');
  defs(svg);
  const LX = 20, AX = 40, S = 0.72;
  const X = (ms) => AX + ms * S;
  const MAX = 1000;

  // 凡例：帯の色と、その長さだと何が起きるか、境目の式
  const legend = [
    ['z-short', tr('短すぎる：平常時にもタイムアウトする', 'Too short: times out even in normal times'), tr('下限 ＝ 下流の平常時の p99 ＋ 上乗せ', 'lower bound = downstream normal p99 + margin')],
    ['z-long', tr('長すぎる：障害時にプールが尽きる', 'Too long: the pool runs out during a failure'), tr('上限 ＝ プールの大きさ × 使ってよい割合（0.7）÷ 1 台あたりのピーク時の到着率', 'upper bound = pool size × usable share (0.7) ÷ peak arrival rate per instance')],
  ];
  legend.forEach(([cls, what, formula], i) => {
    const y = 24 + i * 46;
    el(svg, 'rect', { class: cls, x: LX, y: y - 12, width: 28, height: 14, rx: 2 });
    text(svg, LX + 38, y, 'lbl', what);
    text(svg, LX + 38, y + 20, 'small', formula);
  });

  const TOP = 120, LANE = 172, SH = 18, GAP = 6;
  const lanes = [
    { head: tr('決済 API の p99 が 120ms、スレッド 40 本、到着 60 件/秒', 'Payment API p99 120 ms, 40 threads, 60 req/s'),
      lower: [200, tr('下限 200 ＝ p99 120 ＋ 上乗せ', 'lower 200 = p99 120 + margin')],
      upper: [467, tr('上限 467 ＝ 40 × 0.7 ÷ 60', 'upper 467 = 40 × 0.7 ÷ 60')],
      pick: [300, tr('01a・01b の 300ms', '300 ms in 01a, 01b')],
      verdict: tr('200〜467ms なら、平常時にタイムアウトせず、障害時にもスレッドが尽きない', '200–467 ms: no timeouts in normal times, threads last through a failure'), ok: true },
    { head: tr('同じ決済 API をトランザクションの中で呼ぶ：コネクション 10 本で計算し直す', 'Same API called inside the transaction: recompute with 10 connections'),
      lower: [200, tr('下限 200 ＝ p99 120 ＋ 上乗せ', 'lower 200 = p99 120 + margin')],
      upper: [117, tr('上限 117 ＝ 10 × 0.7 ÷ 60', 'upper 117 = 10 × 0.7 ÷ 60')],
      pick: [300, tr('01a の 300ms', '300 ms in 01a')],
      verdict: tr('どの値にしても、平常時にタイムアウトするか、障害時にコネクションが尽きる', 'Any value either times out in normal times or runs out of connections'), ok: false },
    { head: tr('決済 API の p99 が 600ms、スレッド 40 本、到着 60 件/秒', 'Payment API p99 600 ms, 40 threads, 60 req/s'),
      lower: [800, tr('下限 800 ＝ p99 600 ＋ 上乗せ', 'lower 800 = p99 600 + margin')],
      upper: [467, tr('上限 467 ＝ 40 × 0.7 ÷ 60', 'upper 467 = 40 × 0.7 ÷ 60')],
      pick: [800, tr('02a の 800ms', '800 ms in 02a')],
      verdict: tr('どの値にしても、平常時にタイムアウトするか、障害時にスレッドが尽きる', 'Any value either times out in normal times or runs out of threads'), ok: false },
  ];
  const END = TOP + lanes.length * LANE - 20;

  // 目盛りの縦線（段をまたいで値をそろえて読めるように）
  for (let ms = 0; ms <= MAX; ms += 200) el(svg, 'line', { class: 'row-grid', x1: X(ms), y1: TOP + 22, x2: X(ms), y2: END });

  /** 帯の中か外に、境目の式を書く。入りきらなければ外に出す */
  function stripeLabel(x0, x1, y, s, cls, side) {
    const t = el(svg, 'text', { x: 0, y, class: cls }, s);
    const w = t.getComputedTextLength();
    svg.removeChild(t);
    if (x1 - x0 >= w + 16) {
      if (side === 'end') text(svg, x1 - 8, y, `${cls} end`, s);
      else text(svg, x0 + 8, y, cls, s);
    } else if (side === 'end') {
      text(svg, x1 + 8, y, cls, s);
    } else {
      text(svg, x0 - 8, y, `${cls} end`, s);
    }
  }

  lanes.forEach(({ head, lower, upper, pick, verdict, ok }, i) => {
    const y = TOP + i * LANE;
    text(svg, LX, y + 14, 'hl', head);
    const ys = y + 44, yl = ys + SH + GAP;
    // 上の帯：0〜下限（短すぎる）。下の帯：上限〜（長すぎる）
    el(svg, 'rect', { class: 'z-short', x: X(0), y: ys, width: X(lower[0]) - X(0), height: SH });
    el(svg, 'rect', { class: 'z-long', x: X(upper[0]), y: yl, width: X(MAX) - X(upper[0]), height: SH });
    // 帯の中には境目の値だけを書き、式は帯の下の 1 行にまとめる（選んだ値の線と重ねない）
    stripeLabel(X(0), X(lower[0]), ys + 14, tr(`下限 ${lower[0]}`, `lower ${lower[0]}`), 't-short', 'end');
    stripeLabel(X(upper[0]), X(MAX), yl + 14, tr(`上限 ${upper[0]}`, `upper ${upper[0]}`), 't-long', 'start');
    text(svg, LX, yl + SH + 24, 'small', `${lower[1]}　／　${upper[1]}`);
    // 実験で選んだ値
    const [p, label] = pick;
    el(svg, 'line', { x1: X(p), y1: ys - 8, x2: X(p), y2: yl + SH + 8, stroke: '#5342a2', 'stroke-width': 3 });
    text(svg, X(p) + 8, ys - 10, 'small ord b', label);
    // 結論：起きることを、そのまま書く
    text(svg, LX, yl + SH + 50, ok ? 'body b' : 'body b bad', verdict);
  });

  // 共通の目盛り
  el(svg, 'line', { class: 'axis', x1: X(0), y1: END, x2: X(MAX), y2: END });
  for (let ms = 0; ms <= MAX; ms += 200) text(svg, X(ms), END + 20, 'small mid', ms === MAX ? '1000 ms' : String(ms));
  text(svg, LX, END + 46, 'note', tr('横軸はタイムアウトの値。紫の線は、各シナリオで実際に設定した値', 'The axis is the timeout value. Purple lines are the values each scenario set'));
  canvas(svg, 800, END + 60);
</script>
</body>
</html>
