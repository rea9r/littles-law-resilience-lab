<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Defenses</title>
<link rel="stylesheet" href="explainer.css">
<style>
  /* 行ごとの色：スレッド・コネクション・決済 API の呼び出し。濃い色が握っている、薄い色が空きを待っている */
  .r0 { fill: #55555f; } .r0w { fill: #c9c9d1; } .t0 { fill: #3c3c44; }
  .r1 { fill: #3b7dd8; } .r1w { fill: #b8cdf0; } .t1 { fill: #2b62b3; }
  .r2 { fill: #6a55d6; } .r2w { fill: #c3b9f2; } .t2 { fill: #5342a2; }
</style>
</head>
<body>
<!-- /orders 1 件が、スレッド・コネクション・決済 API の呼び出しを握る時間の入れ子と、各防御がそのどこに効くか。上の段は決済 API をトランザクションの中で呼ぶ形、下の段は外で呼ぶ形で、防御はそれが効く段の、効く場所に点を打つ。W はスレッドやコネクションを握る・待つ時間、L と λ は決済 API の呼び出しについての値。棒の長さは模式で、比例していない -->
<svg id="fig" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="explainer.js"></script>
<script>
  const svg = document.getElementById('fig');
  defs(svg);
  const LX = 20, BX = 236, BE = 760, BH = 14;
  const X = (f) => BX + (BE - BX) * f;
  const ROWS = [tr('スレッド', 'Thread'), tr('コネクション', 'DB connection'), tr('決済 API の呼び出し', 'Payment call')];

  /** 行の名前と棒。segs は行ごとの [始まり, 終わり, クラス] の並び（0〜1 の割合） */
  const GAP = 36;
  function lane(y, segs) {
    segs.forEach((row, i) => {
      text(svg, LX, y + i * GAP + 12, `body b t${i}`, ROWS[i]);
      for (const [a, b, cls] of row) el(svg, 'rect', { class: cls === 'f-ord-wait' ? `r${i}w` : `r${i}`, x: X(a), y: y + i * GAP, width: Math.max(4, X(b) - X(a)), height: BH, rx: 2 });
    });
  }

  /** 効く場所の点 */
  function dot(x, y) {
    el(svg, 'circle', { cx: x, cy: y, r: 5, fill: '#19191c' });
  }

  /** 効く場所：縦の切れ目と点。記号（W・L・λ）と名前を点の左か右に書く */
  function mark(x, top, y, letter, name, side) {
    el(svg, 'line', { class: 'cut', x1: x, y1: top, x2: x, y2: y - 5 });
    dot(x, y);
    if (side === 'left') {
      const end = x - 14;
      text(svg, end, y + 5, 'body end', name);
      if (letter) text(svg, end - svg.lastChild.getComputedTextLength() - 6, y + 5, 'lbl end', letter);
    } else {
      let cx = x + 14;
      if (letter) cx = text(svg, cx, y + 5, 'lbl', letter) + 6;
      text(svg, cx, y + 5, 'body', name);
    }
  }

  // 1. 決済 API をトランザクションの中で呼ぶとき。コネクションを決済の待ちのあいだも握る
  text(svg, LX, 28, 'hl ord', tr('決済 API をトランザクションの中で呼ぶとき', 'Payment call inside the DB transaction'));
  const Y1 = 46;
  lane(Y1, [[[0, 1, 'f-ord']], [[0.02, 0.12, 'f-ord-wait'], [0.12, 0.97, 'f-ord']], [[0.22, 0.9, 'f-ord']]]);
  text(svg, X(0.07), Y1 + 30, 'small mid', tr('取得待ち', 'waiting'));
  el(svg, 'path', { d: `M${X(0.22)} ${Y1 + 94} v6 H${X(0.9)} v-6`, fill: 'none', stroke: '#c03a33', 'stroke-width': 1.4 });
  text(svg, (X(0.22) + X(0.9)) / 2, Y1 + 118, 'small bad mid', tr('障害で 0.05 秒 → 5.05 秒', '0.05 s → 5.05 s during the fault'));
  mark(X(0.9), Y1 + 86, Y1 + 152, 'W', tr('タイムアウト', 'timeout'), 'left');

  // 2. 決済 API をトランザクションの外で呼ぶとき：先に呼び、あとの短いトランザクション（INSERT）だけコネクションを握る（OrderService.kt）
  const Y2 = Y1 + 206;
  text(svg, LX, Y2, 'hl ord', tr('決済 API をトランザクションの外で呼ぶとき', 'Payment call outside the transaction'));
  const L2 = Y2 + 18;
  lane(L2, [[[0, 0.84, 'f-ord']], [[0.74, 0.76, 'f-ord-wait'], [0.76, 0.82, 'f-ord']], [[0.04, 0.72, 'f-ord']]]);
  mark(X(0.79), L2 + GAP + 14, L2 + 116, 'W', tr('トランザクションを短くし、取得待ちを打ち切る', 'shorter transaction, capped connection wait'), 'left');
  // 呼び出しを包む 3 つ（上から外側 → 内側。PaymentClient の Retry(CircuitBreaker(Bulkhead(呼び出し)))）
  const RB = L2 + 184;
  text(svg, X(0.04) + 14, RB - 28, 'note', tr('呼び出しを包む順（上が外側）', 'Wrapping order (top is outermost)'));
  el(svg, 'line', { class: 'cut', x1: X(0.04), y1: L2 + 2 * GAP + 14, x2: X(0.04), y2: RB + 52 });
  [['', tr('リトライ（外側。W と試行が増える）', 'retry (outermost; raises W and attempts)')],
   ['λ', tr('サーキットブレーカー', 'circuit breaker')],
   ['L', tr('バルクヘッド（内側）', 'bulkhead (innermost)')]].forEach(([letter, name], i) => {
    const y = RB + i * 28;
    dot(X(0.04), y);
    let cx = X(0.04) + 14;
    if (letter) cx = text(svg, cx, y + 5, 'lbl', letter) + 6;
    text(svg, cx, y + 5, 'body', name);
  });
  const Y2END = RB + 60;

  // 凡例：色と、W・L・λ
  const LY = Y2END + 40;
  let lx = LX;
  for (const [cls, s] of [['r1', tr('濃い色：握っている', 'dark: held')], ['r1w', tr('薄い色：空きを待っている', 'light: waiting')]]) {
    el(svg, 'rect', { class: cls, x: lx, y: LY - 11, width: 13, height: 13 });
    lx = text(svg, lx + 20, LY, 'body', s) + 28;
  }
  lx = LX;
  for (const [m, s] of [['W', tr('スレッドやコネクションを握る・待つ時間', 'time a thread or connection is held or waited for')], ['L', tr('決済 API を同時に呼ぶ数', 'concurrent payment calls')], ['λ', tr('決済 API を 1 秒に呼ぶ数', 'payment calls per second')]]) {
    lx = text(svg, lx, LY + 26, 'lbl', m) + 5;
    lx = text(svg, lx, LY + 26, 'body', s) + 22;
  }
  canvas(svg, 800, LY + 44);
</script>
</body>
</html>
