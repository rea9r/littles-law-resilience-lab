<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Architecture (slide style)</title>
<link rel="stylesheet" href="slide.css">
</head>
<body>
<!-- 升目：箱は 140×56 の 1 種類。列の左端は 16・220・420・620。段は 40（observability）と 228（app） -->
<svg class="fig" width="800" height="448" viewBox="0 0 800 448" xmlns="http://www.w3.org/2000/svg" data-themes="dark light">
  <defs>
    <marker id="fig-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker>
    <marker id="fig-arrow-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <rect class="bg" width="800" height="448"/>
  <g transform="translate(12 12)">

  <!-- ns: observability -->
  <rect class="frame" x="404" y="0" width="372" height="132"/>
  <text class="n" x="420" y="26">ns: observability</text>
  <rect class="box" x="420" y="40" width="140" height="56"/>
  <rect class="box" x="620" y="40" width="140" height="56"/>
  <text class="t mid" x="490" y="68">Prometheus</text>
  <text class="t mid" x="690" y="68">Grafana</text>
  <text class="n mid" x="490" y="116" data-en="scrapes every 1 s">1 秒ごとに収集</text>
  <text class="n mid" x="690" y="116">localhost:3000</text>
  <line class="ln to" x1="560" y1="68" x2="618" y2="68"/>

  <!-- メトリクス：3 か所から括弧の形で集めて Prometheus へ。注記の上を通らないよう、箱の左寄りに入れる -->
  <path class="ln dash" d="M86 228 V160 H690 V228"/>
  <line class="ln dash" x1="290" y1="228" x2="290" y2="160"/>
  <line class="ln dash to" x1="440" y1="160" x2="440" y2="98"/>
  <text class="n" x="102" y="150" data-en="metrics">メトリクス</text>

  <!-- ns: loadtest -->
  <rect class="frame" x="0" y="188" width="172" height="236"/>
  <text class="n" x="16" y="214">ns: loadtest</text>
  <rect class="box" x="16" y="228" width="140" height="56"/>
  <text class="t mid" x="86" y="256">k6</text>
  <text class="n mid" x="86" y="304" data-en="constant arrivals">一定の到着率</text>

  <!-- ns: app -->
  <rect class="frame" x="204" y="188" width="572" height="236"/>
  <text class="n" x="220" y="214">ns: app</text>
  <rect class="box key" x="220" y="228" width="140" height="56"/>
  <rect class="box" x="420" y="228" width="140" height="56"/>
  <rect class="box" x="620" y="228" width="140" height="56"/>
  <rect class="box" x="220" y="352" width="140" height="56"/>
  <text class="on mid" x="290" y="256">order-api</text>
  <text class="t mid" x="490" y="256">Toxiproxy</text>
  <text class="t mid" x="690" y="256">payment-api</text>
  <text class="t mid" x="290" y="380">PostgreSQL</text>
  <text class="n mid" x="290" y="304" data-en="under test">測定対象</text>
  <text class="n mid" x="490" y="304" data-en="injects latency">遅延を注入</text>
  <text class="n mid" x="690" y="304" data-en="payment mock">決済 API のモック</text>

  <line class="ln to" x1="156" y1="256" x2="218" y2="256"/>
  <text class="n mid" x="188" y="242">70 rps</text>
  <line class="ln to" x1="360" y1="256" x2="418" y2="256"/>
  <text class="n mid" x="390" y="242">/orders</text>
  <line class="ln key to" x1="560" y1="256" x2="618" y2="256"/>
  <text class="k mid" x="590" y="242" data-en="+5 s">+5 秒</text>
  <text class="n sm mid" x="590" y="274" data-en="fault">障害時</text>
  <line class="ln to" x1="236" y1="284" x2="236" y2="350"/>
  </g>
</svg>
<script src="diagram.js"></script>
</body>
</html>
