<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Scenario timeline</title>
<link rel="stylesheet" href="explainer.css">
</head>
<body>
<!-- 1 回の実行：負荷は最後まで一定、区間は 60・60・120・120 秒（1 秒 = 2px）。下の括弧は、どの値をどの区間で測るか。0 秒より前の準備と、回復の定義は本文に書く -->
<svg id="fig" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="explainer.js"></script>
<script>
  const svg = document.getElementById('fig');
  defs(svg);
  const X0 = 56, S = 2;
  const x = (t) => X0 + t * S;

  // 出来事
  const EY = 30;
  text(svg, x(0), EY, 'lbl', tr('負荷を開始', 'load starts'));
  text(svg, x(120), EY, 'lbl bad mid', tr('遅延を入れる（決済 API の応答 +5 秒）', 'delay added (payment API +5 s)'));
  text(svg, x(240), EY, 'lbl bad mid', tr('遅延を外す', 'delay removed'));

  // 負荷（最後まで一定）
  // 到着は流れなので、握っている時間を表す太い棒ではなく、細い矢印で描く
  text(svg, x(0), 60, 'small ord b', tr('到着 /orders 60 件/秒', 'arrivals /orders 60 req/s'));
  el(svg, 'line', { class: 'ln ord', x1: x(0), y1: 70, x2: x(360) - 3, y2: 70, 'marker-end': 'url(#arrow-ord)' });
  text(svg, x(0), 94, 'small prd b', tr('到着 /products 10 件/秒', 'arrivals /products 10 req/s'));
  el(svg, 'line', { class: 'ln prd', x1: x(0), y1: 104, x2: x(360) - 3, y2: 104, 'marker-end': 'url(#arrow-prd)' });

  // 区間
  const PY = 122, PH = 52;
  const phases = [
    [0, 60, tr('ウォームアップ', 'Warm-up'), '#ffffff', '#b4b4bc', 'name'],
    [60, 120, tr('平常時', 'Normal'), '#e9e9ee', '#b4b4bc', 'name'],
    [120, 240, tr('障害中', 'Fault'), '#fbe3e1', '#c03a33', 'name bad'],
    [240, 360, tr('遅延を外したあと', 'After the fault'), '#ffffff', '#b4b4bc', 'name'],
  ];
  for (const [a, b, name, fill, stroke, cls] of phases) {
    el(svg, 'rect', { x: x(a), y: PY, width: (b - a) * S, height: PH, fill, stroke, 'stroke-width': 1.2 });
    text(svg, (x(a) + x(b)) / 2, PY + 22, `${cls} mid`, name);
    text(svg, (x(a) + x(b)) / 2, PY + 42, 'small mid', tr(`${b - a} 秒`, `${b - a} s`));
  }
  for (const t of [120, 240]) el(svg, 'line', { class: 'cut', x1: x(t), y1: EY + 8, x2: x(t), y2: PY });
  for (const t of [0, 60, 120, 240, 360]) text(svg, x(t), PY + PH + 20, 'small mid', t === 360 ? tr('360 秒', '360 s') : String(t));

  // どの値をどの区間で測るか
  const bracket = (a, b, y) => el(svg, 'path', { d: `M${x(a) + 2} ${y} v7 H${x(b) - 2} v-7`, fill: 'none', stroke: '#6e6e73', 'stroke-width': 1.3 });
  const RA = PY + PH + 40;
  bracket(60, 120, RA);
  text(svg, (x(60) + x(120)) / 2, RA + 28, 'body mid', tr('L と λW', 'L vs λW'));
  text(svg, (x(60) + x(120)) / 2, RA + 48, 'body mid', tr('成功率', 'success rate'));
  bracket(120, 240, RA);
  text(svg, (x(120) + x(240)) / 2, RA + 28, 'body mid', tr('成功率・使用中のスレッド・取得待ち', 'success rate, busy threads,'));
  if (LANG === 'en') text(svg, (x(120) + x(240)) / 2, RA + 48, 'body mid', 'connection waits');
  bracket(240, 360, RA);
  text(svg, (x(240) + x(360)) / 2, RA + 28, 'body mid', tr('回復までの時間', 'time to recover'));
  const RB = RA + 66;
  bracket(120, 135, RB);
  text(svg, x(135) + 8, RB + 12, 'body', tr('スレッドが尽きるまで（障害から 15 秒のうちに）', 'time until threads run out (within the first 15 s)'));
  const RC = RB + 36;
  bracket(0, 360, RC);
  text(svg, (x(0) + x(360)) / 2, RC + 28, 'body mid', tr('再起動の回数（負荷をかけている間の全体）', 'Pod restarts (over the whole load)'));
  canvas(svg, 800, RC + 42);
</script>
</body>
</html>
