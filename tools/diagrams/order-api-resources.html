<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>order-api resources</title>
<link rel="stylesheet" href="diagram.css">
</head>
<body>
<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- リクエスト -->
  <rect class="node load" x="24" y="226" width="150" height="108" rx="10"/>
  <text class="title" x="99" y="260" text-anchor="middle" data-en="Requests">リクエスト</text>
  <text class="mono" x="99" y="290" text-anchor="middle">/orders 60 rps</text>
  <text class="mono" x="99" y="310" text-anchor="middle">/products 10 rps</text>
  <path class="edge" d="M174 280 H220" marker-end="url(#arrow)"/>

  <!-- order-api の Pod -->
  <rect class="ns" x="200" y="20" width="760" height="460" rx="14"/>
  <text class="ns-label" x="216" y="44" data-en="order-api (Pod)">order-api（Pod）</text>

  <!-- Tomcat のスレッドプール -->
  <rect class="node shared" x="224" y="150" width="220" height="260" rx="10"/>
  <text class="title" x="334" y="182" text-anchor="middle" data-en="Tomcat thread pool">Tomcat スレッドプール</text>
  <text class="sub" x="334" y="204" text-anchor="middle">maxThreads 40</text>
  <g transform="translate(248 222)" data-slots="40" data-used="3" data-cols="8"></g>
  <text class="shared-label" x="334" y="358" text-anchor="middle" data-en="shared by every API">全 API で共有</text>
  <text class="sub" x="334" y="384" text-anchor="middle" data-en="filled: in use normally (≈3)">塗り：平常時に使用中（約 3 本）</text>

  <!-- エンドポイント -->
  <path class="edge" d="M444 280 H466 M466 126 V434"/>
  <path class="edge" d="M466 126 H486" marker-end="url(#arrow)"/>
  <path class="edge" d="M466 280 H486" marker-end="url(#arrow)"/>
  <path class="edge" d="M466 434 H486" marker-end="url(#arrow)"/>

  <rect class="node target" x="490" y="96" width="160" height="60" rx="10"/>
  <text class="title" x="570" y="122" text-anchor="middle">/orders</text>
  <text class="sub" x="570" y="144" text-anchor="middle" data-en="calls the payment API">決済 API を呼ぶ</text>

  <rect class="node target" x="490" y="250" width="160" height="60" rx="10"/>
  <text class="title" x="570" y="276" text-anchor="middle">/products</text>
  <text class="sub" x="570" y="298" text-anchor="middle" data-en="reads the DB only">DB を読むだけ</text>

  <rect class="node load" x="490" y="404" width="160" height="60" rx="10"/>
  <text class="title" x="570" y="430" text-anchor="middle">/livez</text>
  <text class="sub" x="570" y="452" text-anchor="middle">liveness probe</text>

  <!-- PaymentClient：内側から Bulkhead → CircuitBreaker → Retry の順に包む -->
  <text class="layer-label" x="700" y="56">PaymentClient（Resilience4j）</text>
  <rect class="layer" x="700" y="66" width="240" height="184" rx="10"/>
  <text class="layer-label" x="714" y="88" data-en="Retry (up to 3 attempts)">Retry（最大 3 回）</text>
  <rect class="layer" x="712" y="98" width="216" height="140" rx="8"/>
  <text class="layer-label" x="726" y="120">CircuitBreaker</text>
  <rect class="layer" x="724" y="130" width="192" height="96" rx="8"/>
  <text class="layer-label" x="738" y="152" data-en="Bulkhead (12 at a time)">Bulkhead（同時 12）</text>
  <rect class="node target" x="736" y="162" width="168" height="52" rx="6"/>
  <text class="layer-label" x="820" y="184" text-anchor="middle" data-en="HTTP call">HTTP 呼び出し</text>
  <text class="sub" x="820" y="203" text-anchor="middle" data-en="with a timeout">タイムアウト付き</text>
  <path class="edge" d="M650 126 H696" marker-end="url(#arrow)"/>

  <!-- HikariCP -->
  <rect class="node shared" x="720" y="290" width="200" height="160" rx="10"/>
  <text class="title" x="820" y="322" text-anchor="middle">HikariCP</text>
  <text class="sub" x="820" y="344" text-anchor="middle" data-en="pool 10">プール 10</text>
  <g transform="translate(767 362)" data-slots="10" data-used="3" data-cols="5"></g>
  <text class="shared-label" x="820" y="432" text-anchor="middle" data-en="shared by every API">全 API で共有</text>
  <path class="edge" d="M650 146 H684 V370 H716" marker-end="url(#arrow)"/>
  <path class="edge" d="M650 280 H684"/>

  <!-- Pod の外 -->
  <rect class="node downstream" x="1000" y="100" width="176" height="96" rx="10"/>
  <text class="title" x="1088" y="142" text-anchor="middle">payment-api</text>
  <text class="sub" x="1088" y="166" text-anchor="middle" data-en="via Toxiproxy">Toxiproxy 経由</text>
  <path class="edge" d="M940 148 H996" marker-end="url(#arrow)"/>

  <path class="node db" d="M1000 344 a88 14 0 0 1 176 0 v48 a88 14 0 0 1 -176 0 z"/>
  <path d="M1000 344 a88 14 0 0 0 176 0" fill="none" stroke="#16a34a" stroke-width="1.6"/>
  <text class="title" x="1088" y="386" text-anchor="middle">PostgreSQL</text>
  <path class="edge" d="M920 370 H996" marker-end="url(#arrow)"/>

  <text class="caption" x="200" y="520" data-en="Red boxes are shared by every API. Once L reaches their limit, even APIs that never call the payment API stop.">赤い枠の資源は全 API で共有している。L がここの上限に達すると、決済 API を使わない API まで止まる。</text>
</svg>
<script src="diagram.js"></script>
</body>
</html>
