<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Failure spread (explainer)</title>
<link rel="stylesheet" href="skill.css">
</head>
<body>
<!-- 解説図（explain-as-slides の b52 の作法）。レーンは 呼ぶ側 0〜110・order-api 160〜400・決済 API 450〜550、番号の列は x=574。
     升目は 1 個 14×14・間 4（8 列 × 5 段 = 40 本）。段は ① 122・② 230・③ 340・④ 410・⑤ 574 -->
<svg class="fig" width="800" height="640" viewBox="0 0 800 640" xmlns="http://www.w3.org/2000/svg" data-themes="light dark">
  <defs>
    <marker id="fig-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker>
    <marker id="fig-arrow-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <rect class="bg" width="800" height="640"/>

  <!-- レーン -->
  <rect class="lane" x="0" y="0" width="110" height="640"/><rect class="lane-bar" x="0" y="0" width="110" height="4"/>
  <text class="t lane-t" x="12" y="32" data-en="Callers">呼ぶ側</text>
  <rect class="lane" x="160" y="0" width="240" height="640"/><rect class="lane-bar tone-violet" x="160" y="0" width="240" height="4"/>
  <text class="t tone-violet lane-t" x="176" y="32">order-api</text>
  <rect class="lane" x="450" y="0" width="100" height="640"/><rect class="lane-bar tone-teal" x="450" y="0" width="100" height="4"/>
  <text class="t tone-teal lane-t" x="462" y="32" data-en="Payment">決済 API</text>

  <!-- 障害中の区間 -->
  <rect class="zone tone-orchid" x="0" y="200" width="550" height="440"/>
  <text class="zone-t tone-orchid" x="66" y="226" data-en="During the fault">障害中</text>

  <!-- 呼ぶ側 -->
  <rect class="box" x="10" y="62" width="90" height="36"/><text class="t mid" x="55" y="80">k6</text>
  <rect class="box" x="10" y="556" width="90" height="36"/><text class="t mid" x="55" y="574">kubelet</text>

  <!-- ① 平常時：スレッドは約 3 本 -->
  <rect class="box tone-violet" x="176" y="56" width="208" height="132"/>
  <text class="t tone-violet mid" x="280" y="76" data-en="Threads (normal)">スレッド（平常時）</text>
  <g id="slots-normal"></g>
  <line class="ln to" x1="100" y1="80" x2="174" y2="80"/><text class="n mid" x="137" y="66">70 rps</text>
  <line class="ln to" x1="384" y1="120" x2="448" y2="120"/><text class="n mid" x="416" y="106" data-en="pay">決済</text>
  <rect class="chip" x="394" y="126" width="44" height="22"/><text class="chip-t" x="416" y="137">50ms</text>

  <!-- ② 決済 API に +5 秒 -->
  <rect class="box tone-orchid" x="455" y="212" width="90" height="36"/><text class="t tone-orchid mid" x="500" y="230">Toxiproxy</text>
  <text class="n mid" x="500" y="266" data-en="+5 s">+5 秒</text>

  <!-- ③ 障害時：40 本すべてが埋まる -->
  <rect class="box tone-violet" x="176" y="290" width="208" height="132"/>
  <text class="t tone-violet mid" x="280" y="310" data-en="Threads (fault)">スレッド（障害時）</text>
  <g id="slots-fault"></g>
  <line class="ln to" x1="384" y1="340" x2="448" y2="340"/><text class="n mid" x="416" y="326" data-en="wait 5 s">5 秒待つ</text>

  <!-- ④ /products も空きを待つ -->
  <path class="ln to" d="M55 98 V410 H174"/><text class="n mid" x="118" y="396">/products</text>

  <!-- ⑤ /livez も応答できない -->
  <rect class="box" x="235" y="556" width="90" height="36"/><text class="t m mid" x="280" y="574">/livez</text>
  <line class="ln to" x1="100" y1="574" x2="233" y2="574"/><text class="n mid" x="166" y="560" data-en="probe">確認</text>
  <line class="ln dash to" x1="280" y1="556" x2="280" y2="424"/><text class="n sm" x="290" y="494" data-en="waits for a thread">スレッドを待つ</text>

  <!-- 番号と注釈 -->
  <circle class="step" cx="574" cy="122" r="12"/><text class="step-n" x="574" y="122">1</text>
  <text class="ann-t" x="594" y="118" data-en="Normal: about 3">平常時は約 3 本</text>
  <text class="ann" x="594" y="136" data-en="60 rps × 0.05 s ≈ 3">60 rps × 0.05 秒 ≈ 3</text>
  <text class="ann" x="594" y="153" data-en="under 10% of the 40">上限 40 本の 1 割弱</text>

  <circle class="step" cx="574" cy="230" r="12"/><text class="step-n" x="574" y="230">2</text>
  <text class="ann-t" x="594" y="226" data-en="Payment slows down">決済 API が遅れる</text>
  <text class="ann" x="594" y="244" data-en="Toxiproxy delays every">Toxiproxy が応答を</text>
  <text class="ann" x="594" y="261" data-en="answer by 5 s">5 秒ずつ遅らせる</text>

  <circle class="step" cx="574" cy="340" r="12"/><text class="step-n" x="574" y="340">3</text>
  <text class="ann-t" x="594" y="336" data-en="Gone in 0.7 s">0.7 秒で尽きる</text>
  <text class="ann" x="594" y="354" data-en="needs 60 × 5 = 300">要るのは 60×5 = 300 本</text>
  <text class="ann" x="594" y="371" data-en="40 fill up in 0.7 s">40 本は 0.7 秒で埋まる</text>

  <circle class="step" cx="574" cy="410" r="12"/><text class="step-n" x="574" y="410">4</text>
  <text class="ann-t" x="594" y="406" data-en="Others stop too">関係ない API も止まる</text>
  <text class="ann" x="594" y="424" data-en="/products waits for a">/products も空きを待ち</text>
  <text class="ann" x="594" y="441" data-en="thread and times out">5 秒で失敗する</text>

  <circle class="step" cx="574" cy="574" r="12"/><text class="step-n" x="574" y="574">5</text>
  <text class="ann-t" x="594" y="570" data-en="Restart loop">再起動が続く</text>
  <text class="ann" x="594" y="588" data-en="/livez cannot answer,">/livez も応答できず</text>
  <text class="ann" x="594" y="605" data-en="so the Pod restarts">Pod が再起動する</text>
</svg>
<script>
  // 升目：14×14、間 4、8 列 × 5 段。平常時は 3 本、障害時は 40 本すべてが使用中
  const NS = 'http://www.w3.org/2000/svg';
  for (const [id, x0, y0, used] of [['slots-normal', 210, 92, 3], ['slots-fault', 210, 326, 40]]) {
    const g = document.getElementById(id);
    for (let i = 0; i < 40; i++) {
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', x0 + (i % 8) * 18); r.setAttribute('y', y0 + Math.floor(i / 8) * 18);
      r.setAttribute('width', 14); r.setAttribute('height', 14);
      r.setAttribute('class', `slot tone-violet${i < used ? ' used' : ''}`);
      g.appendChild(r);
    }
  }
</script>
<script src="diagram.js"></script>
</body>
</html>
