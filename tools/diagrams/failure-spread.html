<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Failure spread</title>
<link rel="stylesheet" href="explainer.css">
</head>
<body>
<!-- 平常時と障害時を同じ形で上下に並べる。左から 到着 → 空きを待つ列 → スレッド 40 本 → 同時に要る本数 L と上限の比べ。前提・結果・断り書きは本文（記事と README）に書く -->
<svg id="fig" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="explainer.js"></script>
<script>
  const svg = document.getElementById('fig');
  defs(svg);
  const W = 800;
  const POOL_X = 316, COL_X = 604, GAUGE_W = 180, GAUGE_MAX = 300;

  /** 同時に要る本数を、上限 40 本と同じ目盛りの横棒で比べる。上限を超えた分は斜線で描く（数は書かない。列の長さと読まれるため） */
  function gauge(x, y, need) {
    const px = (n) => (n * GAUGE_W) / GAUGE_MAX;
    el(svg, 'rect', { class: 'f-ord', x, y, width: Math.max(3, px(Math.min(need, 40))), height: 16 });
    if (need > 40) {
      el(svg, 'rect', { class: 'over', x: x + px(40), y, width: px(need - 40), height: 16 });
    }
    el(svg, 'rect', { class: 'cap', x, y, width: px(40), height: 16 });
    text(svg, x, y + 34, 'small', tr('上限 40 本', 'limit 40'));
  }

  function panel(Y, fault) {
    el(svg, 'rect', { x: 20, y: Y, width: 64, height: 26, rx: 4, fill: fault ? '#fbe3e1' : '#e9e9ee' });
    text(svg, 52, Y + 18, `tag mid ${fault ? 'bad' : ''}`, fault ? tr('障害時', 'Fault') : tr('平常時', 'Normal'));
    text(svg, 96, Y + 19, 'hl', fault
      ? tr('決済 API が 5.05 秒かかる。40 本すべてを /orders が握る', 'The payment API takes 5.05 s; /orders requests fill all 40 threads')
      : tr('決済 API が 0.05 秒で返る', 'The payment API responds in 0.05 s'));

    // 到着：何をするエンドポイントかを名前の下に添える。2 本の矢印を 1 点に合流させる（エンドポイントごとの列はない）
    const oEnd = text(svg, 20, Y + 96, 'lbl ord', tr('/orders 60 件/秒', '/orders 60 req/s'));
    text(svg, 20, Y + 115, 'small', tr('決済 API を呼ぶ', 'calls the payment API'));
    const pEnd = text(svg, 20, Y + 144, 'lbl prd', tr('/products 10 件/秒', '/products 10 req/s'));
    text(svg, 20, Y + 163, 'small', tr('DB を読むだけ', 'only reads the DB'));
    const MX = Math.max(oEnd, pEnd) + 26, MY = Y + 122;
    el(svg, 'path', { class: 'ln ord', d: `M${oEnd + 8} ${Y + 91} H${MX - 18} L${MX} ${MY}` });
    el(svg, 'path', { class: 'ln prd', d: `M${pEnd + 8} ${Y + 139} H${MX - 18} L${MX} ${MY}` });
    if (!fault) {
      el(svg, 'line', { class: 'ln', x1: MX, y1: MY, x2: POOL_X - 3, y2: MY, 'marker-end': 'url(#arrow)' });
    } else {
      // 空きを待つ列：スレッドを持たないので薄い色。/orders と /products が到着順に混ざる
      const QX = POOL_X - 8 - 100;
      el(svg, 'line', { class: 'ln', x1: MX, y1: MY, x2: QX - 2, y2: MY });
      [...'ooopoooooo'].forEach((c, i) => {
        el(svg, 'rect', { class: c === 'p' ? 'f-prd-wait' : 'f-ord-wait', x: QX + i * 10, y: MY - 8, width: 7, height: 16, rx: 1 });
      });
      el(svg, 'line', { class: 'ln', x1: QX + 98, y1: MY, x2: POOL_X - 3, y2: MY, 'marker-end': 'url(#arrow)' });
      text(svg, POOL_X - 8, Y + 76, 'small end', tr('空きを待つ列（先着順）', 'queue (FIFO)'));
      text(svg, POOL_X - 8, MY + 30, 'small prd b end', tr('/products も並ぶ', '/products waits too'));
    }

    // スレッド 40 本（/livez も含む全 API で共有）
    el(svg, 'rect', { class: 'pool', x: POOL_X, y: Y + 44, width: 270, height: 158 });
    text(svg, POOL_X + 135, Y + 67, 'lbl mid', tr('スレッド 40 本', '40 threads'));
    text(svg, POOL_X + 135, Y + 86, 'small mid', tr('/livez も含む全エンドポイントで共有', 'shared by all endpoints, even /livez'));
    for (let i = 0; i < 40; i++) {
      el(svg, 'rect', { class: `slot${i < (fault ? 40 : 3) ? ' used' : ''}`, x: POOL_X + 10 + (i % 10) * 26, y: Y + 98 + Math.floor(i / 10) * 26, width: 20, height: 20, rx: 2 });
    }

    // 同時に要る本数 λW（上限がなければ使う本数。上限で頭打ちになる実際の本数 L とは分けて呼ぶ）
    const need = fault ? 300 : 3;
    text(svg, COL_X, Y + 67, 'small', tr('/orders に要る本数（λW）', 'Threads /orders needs (λW)'));
    text(svg, COL_X, Y + 102, `big ${fault ? 'bad' : 'ord'}`, tr(`${need} 本`, `${need}`));
    text(svg, COL_X, Y + 126, 'body', fault ? tr('≈ 60 件/秒 × 5.05 秒', '≈ 60 req/s × 5.05 s') : tr('≈ 60 件/秒 × 0.05 秒', '≈ 60 req/s × 0.05 s'));
    if (fault) gauge(COL_X, Y + 144, need);
  }

  panel(12, false);
  panel(240, true);
  canvas(svg, W, 456);
</script>
</body>
</html>
