apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: order-api-config
    namespace: app
    behavior: merge
    literals:
      - LAB_PAYMENT_TIMEOUT=300ms
      - LAB_PAYMENT_CALL_IN_TX=false
      - LAB_HIKARI_CONNECTION_TIMEOUT_MS=250
      - LAB_RETRY_ENABLED=true
      - LAB_RETRY_MAX_ATTEMPTS=3
      - LAB_RETRY_WAIT=500ms
