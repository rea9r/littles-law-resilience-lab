apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: order-api-config
    namespace: app
    behavior: merge
    literals:
      - LAB_PAYMENT_TIMEOUT=800ms
      - LAB_PAYMENT_CALL_IN_TX=false
      - LAB_HIKARI_CONNECTION_TIMEOUT_MS=250
  - name: payment-api-config
    namespace: app
    behavior: merge
    literals:
      - LAB_TOMCAT_MAX_THREADS=12
      - LAB_LATENCY_MEAN_MS=100
      - LAB_LATENCY_P99_MS=600
