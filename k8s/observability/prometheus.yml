global:
  scrape_interval: 1s
  scrape_timeout: 900ms
  evaluation_interval: 1s

scrape_configs:
  - job_name: order-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-api-metrics.app.svc.cluster.local:8081"]
  - job_name: payment-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-api.app.svc.cluster.local:8081"]
# k6 のメトリクスは remote write で受け取る（--web.enable-remote-write-receiver）
