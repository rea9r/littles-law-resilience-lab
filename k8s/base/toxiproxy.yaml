apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toxiproxy
  template:
    metadata:
      labels:
        app: toxiproxy
    spec:
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.13.0
          args: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
          ports:
            - name: proxy
              containerPort: 8666
            - name: admin
              containerPort: 8474
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: toxiproxy-config
---
# order-api はここを経由して payment-api を呼ぶ
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
  namespace: app
spec:
  selector:
    app: toxiproxy
  ports:
    - name: proxy
      port: 8666
---
# 管理 API。ホストの localhost:8474 から遅延を注入・解除する
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy-admin
  namespace: app
spec:
  type: NodePort
  selector:
    app: toxiproxy
  ports:
    - name: admin
      port: 8474
      nodePort: 30474
