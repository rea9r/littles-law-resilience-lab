apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: payment-api
          image: payment-api:dev
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: payment-api-config
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: app
spec:
  selector:
    app: payment-api
  ports:
    - name: http
      port: 8080
    - name: management
      port: 8081
